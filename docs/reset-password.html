<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Consistency</title>
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: dark; --bg:#101114; --card:#17181c; --surface:#1c1d22; --border:#2a2c33;
    --text:#e8e9ec; --muted:#8b8f99; --accent:#7c9eff; --danger:#e5686b; --success:#46c98f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:flex-start; justify-content:center;
    background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding:48px 20px; }
  main { width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  img { width:56px; height:56px; border-radius:14px; }
  h1 { margin:0; font-size:20px; }
  p { margin:0; color:var(--muted); text-align:center; font-size:14px; }
  form { width:100%; display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
  input { width:100%; min-height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:16px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { min-height:48px; border:none; border-radius:12px; background:var(--accent); color:#10131f;
    font-size:16px; font-weight:600; margin-top:4px; }
  button:disabled { opacity:.5; }
  .msg { width:100%; padding:12px; border-radius:12px; font-size:14px; text-align:center; }
  .err { background:rgba(229,104,107,.14); color:var(--danger); }
  .ok { background:rgba(70,201,143,.16); color:var(--success); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Set a new password</h1>
  <p id="intro">Checking your reset link…</p>
  <form id="form" hidden>
    <label>New password<input id="pw" type="password" autocomplete="new-password" minlength="6" required></label>
    <label>Confirm new password<input id="pw2" type="password" autocomplete="new-password" minlength="6" required></label>
    <button id="save" type="submit">Save new password</button>
  </form>
  <div id="msg" class="msg" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // The "Forgot password?" email from the Consistency app links here. The
  // link carries a one-time recovery session, which supabase-js picks up
  // from the URL by itself; this page just lets you choose the new password.
  const client = supabase.createClient("https://tdskemiyzyvumrlwhvce.supabase.co", "sb_publishable_6_m6g0masaYBIFRbsAuhbQ_sOl8TyLv");
  const intro = document.getElementById("intro");
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const save = document.getElementById("save");

  function show(text, ok) {
    msg.textContent = text;
    msg.className = "msg " + (ok ? "ok" : "err");
    msg.hidden = false;
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error_description")) {
    intro.textContent = "This reset link didn't work.";
    show(hash.get("error_description").replace(/\+/g, " ") + " Ask for a new link from the app.", false);
  } else {
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        intro.textContent = "Choose a new password for your Consistency account.";
        form.hidden = false;
      } else {
        intro.textContent = "This reset link has expired or was already used.";
        show("Go back to the app and tap \"Forgot password?\" again.", false);
      }
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.hidden = true;
    const pw = document.getElementById("pw").value;
    if (pw !== document.getElementById("pw2").value) return show("Passwords don't match.", false);
    if (pw.length < 6) return show("Use at least 6 characters.", false);
    save.disabled = true;
    save.textContent = "Saving…";
    const { error } = await client.auth.updateUser({ password: pw });
    if (error) {
      save.disabled = false;
      save.textContent = "Save new password";
      return show(error.message, false);
    }
    await client.auth.signOut();
    form.hidden = true;
    intro.textContent = "All set.";
    show("Your password is updated. Go back to Consistency and sign in with it.", true);
  });
</script>
</body>
</html>
