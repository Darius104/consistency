[package]
name = "tauri-app"
version = "0.1.17"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

# Self-updates only make sense on desktop - iOS can't install anything
# outside the App Store/TestFlight, so these are never even compiled in
# for that target (mirrors the ios-only objc dependency above, inverted).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

